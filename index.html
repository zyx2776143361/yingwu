<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bird Maze</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <h1 class="logo">🐦 BIRD MAZE</h1>
      <div id="cameraPanel" class="camera-panel">
        <canvas id="cameraCanvas" width="320" height="240"></canvas>
        <div class="cam-bar"><span id="camStatusText">Camera: --</span></div>
      </div>
      <div class="hud">
        <div class="hud-item hud-score">Score&nbsp;<span id="score">0</span></div>
        <div class="hud-item hud-lives">Lives&nbsp;<span id="lives">1</span></div>
      </div>
    </header>
  <div id="permissionScreen" class="overlay hidden">
    <div class="card">
      <div class="card-emoji">🚫</div>
      <h2>Camera Permission Needed</h2>
      <p class="sub">请允许摄像头权限后刷新。<br>必须用 Live Server 打开，不能双击 HTML。</p>
      <button id="reloadBtn" class="btn-primary">🔄 Reload Page</button>
    </div>
  </div>
  <video id="camVideo" autoplay playsinline muted></video>
    <main class="game-wrap">
      <div id="gameArea" class="game-area">
        <canvas id="gameCanvas" width="880" height="600"></canvas>
        <div id="menuScreen" class="overlay">
          <div class="card">
            <h2>BIRD MAZE</h2>
            <p class="sub">Control the bird with your fist.<br>Eat fruit by opening and closing your mouth.</p>
            <button id="startBtn" class="btn-primary">▶ Start Game</button>
          </div>
        </div>
      </div>
    </main>
    <div id="gameOverScreen" class="overlay hidden">
  <div class="card">
    <div class="card-emoji">💥</div>
    <h2>GAME OVER</h2>
    <p class="sub">The bird hit the wall!</p>
    <button id="retryBtn" class="btn-primary">🔄 Play Again</button>
    <p class="final-score">Score: <span id="overScore">0</span></p>
  </div>
</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
